services:
  postgres:
    image: postgres:16-alpine
    container_name: vk_dashboard_db
    environment:
      POSTGRES_DB: vk_dashboard
      POSTGRES_USER: vk_dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vk_dashboard_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vk_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
